  { path = "f64::atanh", reason = "std transcendentals differ by platform; use `libm`" },
  { path = "f64::exp", reason = "std transcendentals differ by platform; use `libm`" },
  { path = "f64::exp2", reason = "std transcendentals differ by platform; use `libm`" },
  { path = "f64::exp_m1", reason = "std transcendentals differ by platform; use `libm`" },
  { path = "f64::ln", reason = "std transcendentals differ by platform; use `libm`" },
